<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fff1e6"/><stop offset=".5" stop-color="#fce7f3"/><stop offset="1" stop-color="#ede9fe"/></linearGradient><linearGradient id="line"><stop stop-color="#f97373"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs>
<style>
