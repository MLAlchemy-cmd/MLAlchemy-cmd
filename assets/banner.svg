<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">Hello, I'm Sahitya!</title><desc id="desc">A colorful peach, pink and lavender banner with floating stars and an animated coding window.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fff1e6"/><stop offset=".5" stop-color="#fce7f3"/><stop offset="1" stop-color="#ede9fe"/></linearGradient><linearGradient id="line"><stop stop-color="#f97373"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><clipPath id="typing"><rect x="56" y="82" width="650" height="70" class="typing"/></clipPath>
<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#a78bfa" opacity=".18"/></pattern></defs>
<style>
.float{animation:float 4s ease-in-out infinite}
.typing{animation:typing 9s steps(18,end) infinite}
.drift{animation:drift 7s ease-in-out infinite}
.orbit{transform-origin:965px 160px;animation:orbit 24s linear infinite}
@keyframes typing{0%{width:0}30%,82%{width:650px}96%,100%{width:0}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(14px,-16px)}}
@keyframes orbit{to{transform:rotate(360deg)}}.twinkle{animation:twinkle 3s ease-in-out infinite}.cursor{animation:blink 1.2s steps(2,start) infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
@keyframes twinkle{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes blink{to{visibility:hidden}}
@media(prefers-reduced-motion:reduce){.float,.twinkle,.cursor,.typing,.drift,.orbit{animation:none}}
</style>
<rect width="1200" height="330" rx="24" fill="url(#bg)"/>
<rect width="1200" height="330" rx="24" fill="url(#dots)"/>
<g class="drift" opacity=".38" fill="none" stroke="#ec4899" stroke-width="2"><path d="M694 94l-13 13 13 13m31-26 13 13-13 13"/><path d="M713 91l-9 33"/></g>
<g class="orbit" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity=".45"><ellipse cx="965" cy="160" rx="205" ry="137" stroke-dasharray="3 11"/><circle cx="1170" cy="160" r="7" fill="#f9a8d4" stroke="none"/></g>
<path d="M0 282Q220 245 450 290T900 283T1200 272V330H0Z" fill="#fff" opacity=".5"/>
<text x="60" y="64" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#a54966">A LITTLE CURIOSITY. A LOT OF CODE.</text>
<text clip-path="url(#typing)" x="56" y="137" font-family="Segoe UI,Arial,sans-serif" font-size="59" font-weight="800" letter-spacing="-2" fill="#352446">Hello, I'm Sahitya!</text>
<text x="60" y="179" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#704567">AI / ML · Data Science · Healthcare AI</text>
<g font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">
<rect x="60" y="211" width="141" height="34" rx="17" fill="#fff" opacity=".8"/><text x="81" y="233" fill="#7c3aed">MS Data Science</text>
<rect x="212" y="211" width="148" height="34" rx="17" fill="#fff" opacity=".8"/><text x="234" y="233" fill="#be185d">UMN Twin Cities</text>
<rect x="371" y="211" width="120" height="34" rx="17" fill="#fff" opacity=".8"/><text x="393" y="233" fill="#0f766e">Class of 2027</text>
</g>
<g class="float">
<rect x="820" y="76" width="306" height="193" rx="17" fill="#c4b5fd" opacity=".35"/>
<rect x="810" y="65" width="306" height="193" rx="17" fill="#30243f"/>
<path d="M810 105H1116" stroke="#5c476f"/>
<circle cx="830" cy="86" r="5" fill="#fb7185"/><circle cx="847" cy="86" r="5" fill="#fbbf24"/><circle cx="864" cy="86" r="5" fill="#5eead4"/>
<g font-family="Consolas,monospace" font-size="17">
<text x="835" y="140" fill="#c4b5fd">curiosity = True</text>
<text x="835" y="174" fill="#f9a8d4">while curiosity:</text>
<text x="855" y="207" fill="#99f6e4">learn() · build()</text>
<rect class="cursor" x="854" y="223" width="10" height="3" fill="#fff"/>
</g></g>
<g class="twinkle" fill="#f59e0b"><path d="M745 55l4 12 12 4-12 4-4 12-4-12-12-4 12-4Z"/><path d="M1155 239l4 12 12 4-12 4-4 12-4-12-12-4 12-4Z"/></g>
<g class="twinkle" style="animation-delay:-1.5s" fill="#a78bfa"><path d="M750 234l3 9 9 3-9 3-3 9-3-9-9-3 9-3Z"/><path d="M1147 40l3 9 9 3-9 3-3 9-3-9-9-3 9-3Z"/></g>
<rect x="60" y="279" width="160" height="4" rx="2" fill="url(#line)"/><circle class="drift" cx="678" cy="253" r="7" fill="#f9a8d4"/><circle class="twinkle" cx="778" cy="32" r="4" fill="#2dd4bf"/>
</svg>